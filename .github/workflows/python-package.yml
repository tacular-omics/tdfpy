name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"

    runs-on: ${{ matrix.os }}

    # Without this, `uv sync` resolves against the interpreter pinned in
    # .python-version and every matrix leg silently tests the same version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Install dependencies
      run: just install

    - name: Verify the interpreter matches this matrix leg
      run: uv run python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}', sys.version"

    - name: Build wheel from source distribution
      run: uv build --out-dir dist

    - name: Verify distribution contents and installed wheel
      run: uv run python scripts/verify_distribution.py dist

    - name: Check formatting
      run: just format-check

    - name: Lint with ruff
      run: just lint

    - name: Type check with ty
      run: just ty

    - name: Test with pytest coverage
      run: just test-cov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/tdfpy
        files: coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/tdfpy
        report_type: test_results
        files: junit.xml
        fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict

  mcp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra mcp
      - run: uv run --extra mcp pytest tests/test_mcp.py -v
      - run: uv build --out-dir dist
      - run: uv run python scripts/verify_distribution.py dist --with-mcp
