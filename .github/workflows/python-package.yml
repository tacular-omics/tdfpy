name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Install dependencies
      run: just install

    - name: Build wheel and verify it ships no native libraries
      run: |
        pip install build
        python -m build --wheel --outdir /tmp/verify-dist
        python -c "
        import zipfile, sys, pathlib
        wheels = list(pathlib.Path('/tmp/verify-dist').glob('*.whl'))
        assert wheels, 'No wheel found'
        with zipfile.ZipFile(wheels[0]) as zf:
            names = zf.namelist()
        # tdfpy reads .tdf_bin directly; shipping a Bruker blob again would
        # reintroduce the redistribution question and the platform lock-in.
        bad = [n for n in names if n.endswith(('.so', '.dll', '.dylib', '.pyd'))]
        if bad:
            print('FAIL: wheel contains native binaries:', bad)
            sys.exit(1)
        if not wheels[0].name.endswith('-py3-none-any.whl'):
            print('FAIL: expected a pure-Python wheel, got', wheels[0].name)
            sys.exit(1)
        print('OK: pure-Python wheel, no native binaries')
        "

    - name: Lint with ruff
      run: just lint

    - name: Type check with ty
      run: just ty

    - name: Test with pytest coverage
      run: just test-cov

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/tdfpy
        files: coverage.xml
        fail_ci_if_error: false

    - name: Generate JUnit test results
      if: ${{ !cancelled() }}
      run: uv run pytest tests --ignore=tests/test_docs.py --junitxml=junit.xml -o junit_family=legacy

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: tacular-omics/tdfpy
        report_type: test_results
        files: junit.xml
        fail_ci_if_error: false
