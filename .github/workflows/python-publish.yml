name: Upload Python Package

on:
  release:
    types: [published]
  # Manual runs are allowed, but the guard below refuses anything that is not a
  # vX.Y.Z tag matching tdfpy.__version__ — a mis-dispatch from a branch cannot
  # publish.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Verify the tag matches tdfpy.__version__
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      run: |
        if [ "$EVENT_NAME" != "release" ] && [ "$REF_TYPE" != "tag" ]; then
          echo "FAIL: manual dispatch must target a vX.Y.Z tag, got $REF_TYPE '$RELEASE_TAG'"
          exit 1
        fi
        VERSION=$(python -c "
        import pathlib, re
        src = pathlib.Path('src/tdfpy/__init__.py').read_text()
        print(re.search(r'^__version__ = [\x22\x27]([^\x22\x27]+)', src, re.M).group(1))
        ")
        if [ "$RELEASE_TAG" != "v$VERSION" ]; then
          echo "FAIL: tag '$RELEASE_TAG' does not match tdfpy.__version__ '$VERSION' (expected 'v$VERSION')"
          exit 1
        fi
        echo "OK: publishing $RELEASE_TAG (tdfpy $VERSION)"

    - uses: astral-sh/setup-uv@v7

    - name: Install verification dependencies
      run: uv sync --locked --group docs --extra mcp

    - name: Verify the release revision
      run: |
        uv run ruff check src/ tests/ scripts/
        uv run ruff format --check src/ tests/ scripts/
        uv run ty check src/
        uv run pytest tests/
        uv run --group docs mkdocs build --strict

    - name: Build wheel from source distribution
      run: uv build --out-dir dist

    - name: Verify distribution contents and installed wheel
      run: uv run python scripts/verify_distribution.py dist --with-mcp

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist

    # Enable the repository variable only after configuring the matching PyPI publisher.
    - name: Publish with Trusted Publishing
      if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Publish with existing token
      if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
