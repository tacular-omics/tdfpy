[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdfpy"
dynamic = ["version"]
description = "Python package for parsing Bruker timsTOF data with centroiding and noise filtering"
authors = [
    {name = "Patrick T. Garrett", email = "pgarrett@scripps.edu"},
    {name = "John R. Yates III", email = "jyates@scripps.edu"},
]
maintainers = [
    {name = "Patrick T. Garrett", email = "pgarrett@scripps.edu"},
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    # Frames in analysis.tdf_bin are zstd-compressed. Python 3.14 ships zstd in
    # the standard library (PEP 784), so the wheel only needs this on older
    # interpreters. A 3.14 build made without libzstd will raise an ImportError
    # naming this package.
    "zstandard>=0.22; python_version < '3.14'",
    # Required so the centroiding stack runs JIT-compiled, which its documented
    # performance assumes. The code does not need it to import: every kernel has
    # a pure-Python fallback, used if numba cannot be imported.
    "numba>=0.59",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bruker", "timstof", "mass-spectrometry", "proteomics", "tdf", "dia", "dda", "pasef", "ion-mobility"]

[project.urls]
Homepage = "https://github.com/tacular-omics/tdfpy"
Documentation = "https://tacular-omics.github.io/tdfpy/"
Repository = "https://github.com/tacular-omics/tdfpy"
Issues = "https://github.com/tacular-omics/tdfpy/issues"
Changelog = "https://github.com/tacular-omics/tdfpy/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.19100532"

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
mcp = ["mcp>=2.1,<3"]

[project.scripts]
tdfpy = "tdfpy.__main__:main"
tdfpy-mcp = "tdfpy.mcp:main"

[tool.hatch.version]
path = "src/tdfpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tdfpy"]

[tool.hatch.build.targets.sdist]
# The sdist carries the source, the tests, and the paperwork — not the ~80 MB
# of example .d folders, rendered plots, dev dashboards, or CI leftovers.
exclude = [
    "tests/data/*.d",
    "plots/",
    "apps/",
    "papers/",
    "docs/llms-full.txt",
    "junit.xml",
    "logo.png",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=9",
    "pytest-examples>=0.0.14",
    "ty>=0.0.83",
    "ruff>=0.16.8",
    "pyupgrade>=3.21.0",
    "pandas>=2.3.3",
    "numpy>=2.3.4",
    "pytest-cov>=6.0.0",
    "matplotlib>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# HEADER holds Markdown table rows, which cannot be wrapped.
"scripts/build_llms_full.py" = ["E501"]
